# The development setup, and it is in git.
#
# Everything here is a setting and there is deliberately no secret in it: the
# session signing key and the Google client come from COCCO_SECRET_KEY,
# COCCO_GOOGLE_CLIENT_ID and COCCO_GOOGLE_CLIENT_SECRET, and have no file
# spelling at all. That is what makes a shared, committed configuration file
# possible in the first place.
#
# The Justfile points COCCO_CONFIG at this file. To run against your own
# settings instead - the real Google flow, another database - write them in
# `cocco.toml`, which is gitignored, and start with
#
#   COCCO_CONFIG=cocco.toml just web   (and the same for `just judge`)

[database]
# Empty on purpose, and not a placeholder: libpq fills the user, database and
# host in from PGUSER, PGDATABASE and PGHOST, which the Nix devShell exports.
# PGHOST there is "$PWD/.pg/sock" - an absolute path that differs per checkout,
# and so the one setting a file in git cannot write down. This is not the
# environment configuring cocco; it is psycopg reading its own standard
# variables, the same ones `pg-start`, `create-db` and `pg_isready` already use.
url = "postgresql+psycopg://"

[storage]
# Test case inputs and expected outputs. The web app and the judge must resolve
# a path to the same bytes, and they agree by both reading this line.
root = "/tmp/cocco-storage"

[dev]
# No Google and no credentials: /login grows a box, and whatever address you
# type into it is who you are. This is what makes a fresh checkout usable at
# all, and on anything public it is equivalent to publishing every password.
#
# Who to type. The seed gives you matteo.ceccarello@unipd.it, the site
# administrator, who can create a course; alice@unipd.it, a plain teacher on
# every seeded course, which is how to see what course staff see; and
# bob@unipd.it and charlie@unipd.it, students. Anything else in an accepted
# domain gets a fresh account with no enrollments - a first sign-in, exactly.
# Sign out to change your mind; that is the whole point of the box.
dummy_auth = true

# Drops the schema and reseeds the dummy data on startup. False, and it has to
# be: `cocco-web --reload` reloads on every file change, and each reload would
# wipe every submission made while testing.
#
# This is *not* how a schema change reaches the database any more - that is a
# migration. Edit `cocco/model.py`, then
#
#   just migration "what changed"     # writes cocco/migrations/versions/...
#   just migrate                      # applies it
#
# and both `cocco-web` and `cocco-judge` will refuse to start until you have.
# What `reset_db` is for is throwing the *data* away: it drops the whole schema,
# re-runs every migration and reseeds the cast below, so it ends up exactly
# where a fresh `just migrate` would, with the dummy data on top. Note that a
# judge started earlier is left holding a schema that has been dropped and
# rebuilt underneath it, so start `just judge` after the web app's reset boot,
# or restart the judge if you reset under a live one.
reset_db = false

# There is no [auth] table on purpose. `allowed_domains` defaults to unipd.it,
# and dummy auth seeds its own administrator, so there is nothing here to
# configure - and a file every checkout shares should not name one person as
# the administrator of all of them.
