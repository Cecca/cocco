[python]
extensions = ["py"]
runtime = "python3"
interpreter = "python"
interpreter_args = ["{executable}"]

[cpp]
extensions = ["cpp", "cc", "cxx"]
runtime = "gcc"
compiler = "g++"
compiler_args = ["-O2", "-std=c++17", "-o", "{output}", "{source}"]

[c]
extensions = ["c"]
runtime = "gcc"
compiler = "gcc"
compiler_args = ["-O2", "-std=c17", "-o", "{output}", "{source}"]

[java]
extensions = ["java"]
runtime = "jdk"
compiler = "javac"
compiler_args = ["{source}"]
output_ext = ".class"
interpreter = "java"
interpreter_args = ["{name}"]
additional_processes = 64 # the JVM needs a lot: GC, JIT and signal-handler threads
