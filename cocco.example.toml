# Copy this to `cocco.toml` and edit it. Nothing here is required: cocco boots
# with no file at all, and the login page then says no sign-in method is
# configured. For development you want none of this - `cocco.dev.toml` is in
# git and the Justfile reads it.
#
# The path is `cocco.toml` in the working directory, overridable with
# COCCO_CONFIG. `cocco.toml` is gitignored.
#
# THE FILE IS SETTINGS; THE ENVIRONMENT IS SECRETS. The secrets have no file
# spelling at all - writing them here does nothing but earn a warning:
#
#   COCCO_SECRET_KEY              the session cookie's signing key
#   COCCO_GOOGLE_CLIENT_ID        the Google OAuth client
#   COCCO_GOOGLE_CLIENT_SECRET
#   COCCO_GITHUB_CLIENT_ID        the GitHub OAuth app
#   COCCO_GITHUB_CLIENT_SECRET
#
# Each provider is turned on by its own pair being present and by nothing else:
# set both halves of one and the login page grows its button, leave them out and
# it does not. Neither knows about the other, and configuring both offers both.
#
# One source each, so there is no precedence to reason about and nothing secret
# in a file that gets copied, diffed and pasted into a bug report. COCCO_CONFIG
# is the exception that proves the rule: it names the file, so it is the one
# setting that cannot be written in one.
#
# The judge reads this same file and takes no --database or --storage of its
# own, so the two processes cannot be pointed at different ones.

[database]
# The SQLAlchemy URL, and it must name a driver with both a sync and an async
# face - `postgresql+psycopg` is the one this project uses: the web app builds
# an async engine from this string and the judge a sync one. (asyncpg has no
# sync side; psycopg2 has no async one.)
#
# Leave the password out and let libpq supply it from PGPASSWORD or ~/.pgpass:
# that keeps the credential out of the file, and an empty URL goes further -
# libpq then resolves the user, database and host from PGUSER, PGDATABASE and
# PGHOST too, which is what `cocco.dev.toml` does.
#
# THE SCHEMA IS NOT CREATED ON BOOT. It is a sequence of revisions shipped
# inside the package, and applying them is a step of deploying:
#
#   cocco-migrate upgrade head        # reads this same file
#   systemctl restart cocco-web cocco-judge
#
# in that order. Both processes check the database against the revisions they
# were built with and refuse to start if it is behind, printing that command -
# so a forgotten migration is a service that will not come up rather than one
# serving 500s off a missing column. `cocco-migrate current` says where a
# database stands; `upgrade head --sql` prints the DDL instead of running it,
# for somebody else to apply. A database that predates all this and whose schema
# already matches is adopted with `cocco-migrate stamp head`, which records the
# revision without running it.
url = "postgresql+psycopg://cocco@localhost/cocco"

[storage]
# Where test case inputs and expected outputs live - they are referenced by
# path from the database, not stored in it (see DESIGN.md). The web app and the
# judge must resolve a path to the same bytes; they agree by both reading this.
root = "/var/lib/cocco/storage"
#
# Every file under it is gzip-compressed, transparently: a million-line test
# case is line-oriented text and compresses several times over, and nothing
# that reads or writes one sees anything but plaintext. There is no fallback
# for a root that predates this, deliberately - `cocco-migrate
# compress-storage` converts one in place (idempotent, and safe to interrupt
# and re-run), and cocco-web and cocco-judge refuse to start until it has been,
# exactly as they refuse a database that is behind its migrations. A brand new
# root needs nothing: it is created marked.

[judge]
# The settings the web app never reads, and the first is the one an
# installed judge cannot do without. A language in `languages.toml` names a
# runtime - python3, gcc, jdk - that some flake has to expose, and the judge
# runs `nix build` to get it. This says which flake.
#
# The default is ".", the flake in the working directory, which is what it was
# implicitly before it could be written down: right for a checkout, and wrong
# for a `cocco-judge` on PATH, which has no checkout to be started from. Give
# it an absolute path to a checkout, or a flake reference nix accepts:
#
#   flake = "/opt/cocco"
#   flake = "github:you/cocco"
#
# Whatever it names must expose the runtimes `languages.toml` asks for, so it
# is the same repository - pinned by its own `flake.lock`, which is what makes
# a compiler version a property of the deployment and not of the machine.
#
# They are all built once, at startup, before the judge picks up anything: a
# flake that cannot build one of them is a judge that refuses to start, rather
# than a submission that fails whenever somebody first uses that language.
flake = "/opt/cocco"

# Where the judge writes one symlink per runtime. Those symlinks are the point:
# `nix build --out-link` registers an indirect GC root for the path it built, so
# a `nix-store --gc` or a `nix-collect-garbage -d` on this host cannot collect an
# interpreter the judge is still handing to isolate. Without them the store path
# is held by nothing nix can see, and the failure arrives as submissions dying
# on a missing file.
#
# The default is $XDG_STATE_HOME/cocco/gcroots, falling back to
# ~/.local/state/cocco/gcroots - durable, per user and per host, which is the
# scope a GC root has. That is right for a checkout and for an ordinary systemd
# unit with a real user; set this when the judge runs with no usable HOME, as
# under `DynamicUser=yes`, and point it at the unit's own StateDirectory.
#
# One directory per judge host *and per deployment*: two judges sharing it while
# naming different flakes would overwrite each other's links, and a collection
# in between could take a runtime the other is using. It is deliberately not
# under `[storage] root` - that is the directory the web app and the judge
# share, and may be on NFS, while a GC root means nothing off this machine.
gcroots = "/var/lib/cocco/gcroots"

# How many jobs the judge works on at once. Each is a worker claiming the next
# job off the queue. Judges on several hosts can share a database, since a job
# is claimed by exactly one of them; two on one host cannot, because each
# numbers its isolate boxes from 0 and they would take each other's - raise
# this instead.
#
# The default is half the hardware threads the judge may run on - those its
# CPU affinity allows, so a unit pinned with CPUAffinity= counts only its own -
# and it is sized against the
# CPU rather than against anything else because the CPU is what runs out first.
# A sandboxed run is mostly an interpreter starting up, and on a 16-thread
# laptop the judge drained a queue about 9x faster with 8 workers than with
# one - and no faster with 16, each run only getting slower. Raise it on a host
# whose runs wait on something other than the CPU; lower it on one that also
# serves the web app. From 1 to 32, the number of isolate boxes one judge uses.
#
# A new submission wakes the judge at once, through a PostgreSQL notification
# the web app sends when it commits; the judge also looks every 5 seconds, so a
# notification that went missing costs that long and no more.
#
# An example only, not the default - 6 on a 12-thread host:
# concurrency = 6

[session]
# Set to true behind TLS, so the cookie is never sent in clear.
https_only = true

# How long a session lasts, in seconds. Two weeks.
max_age = 1209600

# The signing key is COCCO_SECRET_KEY and only that. With it unset, cocco
# generates a random one per process and warns: sessions then die on every
# restart and no two workers agree, which is loud - unlike a fixed secret in
# the source tree, and unlike one written in a file somebody may commit.
#   python -c 'import secrets; print(secrets.token_urlsafe(32))'

[auth]
# Who may sign in. A domain admits itself and every subdomain of it, so
# "unipd.it" already covers @studenti.unipd.it and @phd.unipd.it. An empty list
# admits nobody: a misconfiguration should lock the door, not open it.
allowed_domains = ["unipd.it"]

# The site's administrators: the people who may create a course and open the
# admin page at /admin. Unlike `teacher` or `student`, this is not a role on any
# enrollment - a course being created does not exist yet - so it lives in its
# own table, and these addresses are inserted into it on every startup.
#
# A *bootstrap*, not the truth. It is how a brand new deployment gets its first
# administrator, since there is nobody there to appoint one; afterwards the
# table is what is asked, and /admin is where further ones are appointed. So it
# only ever adds: deleting a line from here demotes nobody, and the way to
# remove an administrator is
#   DELETE FROM administrator WHERE email = '...';
# There is deliberately no revoke button - and for the same reason, /admin will
# not block an administrator, since a blocked one could never be let back in.
# Undoing a block by hand, if it ever comes to that, is
#   UPDATE "user" SET blocked_at = NULL, blocked_reason = NULL WHERE email = '...';
#
# An address is listed before its owner has ever signed in - the account is
# created on the first accepted callback from a provider - so it must be one
# `allowed_domains` admits, or they will never be able to use it.
# administrators = ["you@unipd.it"]

# The OAuth client, from the Google Cloud console: APIs & Services >
# Credentials > Create credentials > OAuth client ID > Web application. On the
# consent screen ask for the `openid` and `email` scopes only - both are
# non-sensitive, so there is no verification review - and choose "Internal" if
# the institution's Workspace owns the project.
#
# Register the callback under "Authorized redirect URIs", exactly:
#   http://localhost:8000/auth/google/callback     (development)
#   https://cocco.example.org/auth/google/callback (production)
# Google matches the full string, so http://127.0.0.1:8000/... is a *different*
# entry and a trailing slash is a mismatch. Register every origin you browse to.
#
# The two halves themselves are COCCO_GOOGLE_CLIENT_ID and
# COCCO_GOOGLE_CLIENT_SECRET in the environment, and there is no file setting
# for them. Half a credential is a typo, not a decision: cocco says so and
# carries on with Google sign-in disabled rather than refusing to boot.

# A hint for Google's account chooser, not an access check: it pre-selects the
# Workspace domain, while `allowed_domains` is what actually decides. Leave it
# unset if your students' addresses live in a secondary domain.
# google_hd = "unipd.it"

# GitHub is the second provider, on exactly the same terms and with no settings
# of its own at all: an OAuth app from Settings > Developer settings > OAuth
# Apps > New OAuth App, and its two halves in COCCO_GITHUB_CLIENT_ID and
# COCCO_GITHUB_CLIENT_SECRET. Register one app per origin you browse to and put
# the callback in "Authorization callback URL", exactly:
#   http://localhost:8000/auth/github/callback     (development)
#   https://cocco.example.org/auth/github/callback (production)
#
# cocco asks for the `user:email` scope and nothing more - the nickname is
# derived from the address, so a profile scope would be data held without being
# used. GitHub is plain OAuth2 rather than OIDC, so there is no ID token: the
# callback asks the API which addresses the account holds, and only a VERIFIED
# one proves anything. `allowed_domains` still decides, and an account whose
# GitHub *primary* is personal signs in fine as long as the institutional
# address is verified beside it - the first verified address inside the domains
# is the one that admits them.

# The way in for the deployment neither provider can serve - no Workspace, no
# GitHub, or no wish to register an OAuth client at all: an address and a
# password. Off
# unless this says otherwise, and the default is false for a reason worth
# reading before you change it.
#
# A PROVIDER PROVES THAT SOMEBODY OWNS THE MAILBOX. A PASSWORD PROVES NOTHING
# ABOUT THE ADDRESS. cocco has no mail path anywhere in it - no SMTP setting, no
# queue, nothing - so it cannot send a verification link, and registering here
# is therefore a *claim* rather than a proof. It is narrowed as far as it can
# be without email: a claim succeeds only on an account that has never been
# signed in, so
#
#   - an address a teacher wrote onto a roster before term can be claimed by
#     its owner, which is the workflow this is shaped around;
#   - an account somebody has actually used cannot be taken over, ever;
#   - and what is left is that whoever types an unused address in
#     `allowed_domains` first gets it.
#
# That last line is what you are accepting. Inside an institution where the
# addresses are already known it is usually fine; on anything reachable from
# the open internet with a permissive `allowed_domains`, it is not. Turning
# this on does not turn a provider off - configure them together and the login
# page offers each of them, which is the safest way to run it: single sign-on
# for everyone who has it, a password for the people who do not.
#
# There is no "forgot my password", again because there is no mail: a site
# administrator issues a new one from /admin, sees it once, and reads it out.
# Its owner replaces it from their own profile page, which is also the only
# place anybody can set their own.
#
# Passwords are stored as salted scrypt (see `cocco/passwords.py`), never in
# the clear and never recoverably - an administrator resets one, nobody reads
# one back. There is no rate limiting anywhere in this app, so put one in front
# of `POST /auth/password` at your reverse proxy before you rely on this.
# password_login = false

[site]
# The absolute base for the OAuth redirect URI. Leave it unset to derive it from
# the incoming request, which is only correct if the reverse proxy sets
# X-Forwarded-* and `proxy_headers` below is on. Set it whenever what cocco
# builds and what the provider has registered could disagree - a proxy that
# terminates TLS makes the request say `http`, and the redirect URI is matched
# character for character, so the mismatch is refused.
# base_url = "https://cocco.example.org"

# Believe the reverse proxy about who the client is: X-Forwarded-For becomes the
# client address on every access-log line, X-Forwarded-Proto the scheme, and
# X-Request-ID the id the request is filed under. Off by default, so a checkout
# with nothing in front of it cannot be told its own address by a client.
# (This used to be `cocco-web --proxy-headers`; the flag still works for one
# release and warns.)
proxy_headers = true

# Whom to believe it from: addresses and CIDR networks, and only connections
# *from* these get their forwarded headers read. The default is loopback in
# both spellings, which is right for nginx on the same host:
#
#   trusted_proxies = ["127.0.0.1", "::1"]
#
# Get this wrong and nothing errors - every request is simply logged with the
# proxy's address instead of the client's, which is useless the day you need
# it. That happens when nginx runs in another container, on another host, or
# reaches the app over an address not listed here; name that address, or its
# network (e.g. "172.18.0.0/16" for a docker bridge). An entry that is neither
# an address nor a network is refused at startup rather than silently matching
# nothing.
#
# The nginx side is three lines in the `location` that proxies to cocco:
#
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header X-Request-ID      $request_id;
#
# `$proxy_add_x_forwarded_for` and never `$http_x_forwarded_for`: the first
# appends the address nginx actually saw to whatever the client sent, and cocco
# takes the right-most entry that is not a trusted proxy - so a client forging
# the header only adds entries to the left, which are never read. The second
# passes the client's forgery through as the whole truth. `$request_id` is what
# puts the same id on nginx's log line and on cocco's; add it to nginx's
# `log_format` to see it there, and cocco echoes it back as X-Request-ID.
#
# nginx's default access log writes `$request`, which includes the query
# string - and the OAuth callback's carries the `code` and the `state`, which
# cocco is careful never to log. Use a `log_format` with `$request_method $uri`
# instead of `$request` if that matters to you.
# trusted_proxies = ["127.0.0.1", "::1"]

[log]
# Every process - cocco-web, cocco-judge, cocco-migrate - writes its log to
# stdout (cocco-migrate to stderr, since `--sql` prints DDL on stdout). "text"
# is for reading; "json" is one object per line, for querying:
#
#   {"ts": "2026-10-17T09:12:03.120+00:00", "level": "INFO",
#    "logger": "cocco.access", "msg": "GET /courses/3 200 41.2ms",
#    "process": "web", "request_id": "6f1c...", "method": "GET",
#    "path": "/courses/3", "route": "/courses/{course_id}", "status": 200,
#    "duration_ms": 41.2, "client_ip": "203.0.113.9", "user_id": 17, ...}
#
# One `cocco.access` line per request, with the route as declared rather than
# the path, so it can be grouped by. Query strings are never logged - the OAuth
# callback's carries the `code` and the `state`. A polled fragment that worked
# is logged at DEBUG, so the default level is not drowned in polls; one that
# failed still shows. Every line a request causes carries its `request_id`, and
# every line of a graded run its `submission_id`, `challenge_id` and `language`.
format = "json"

# DEBUG, INFO, WARNING, ERROR or CRITICAL. `--log-level` on any of the three
# commands overrides it for one run.
# level = "INFO"
#
# A few questions, asked of `journalctl -u cocco-web -o cat` saved to cocco.log:
#
#   # the slowest routes
#   jq -r 'select(.logger == "cocco.access") | [.duration_ms, .route] | @tsv' \
#       cocco.log | sort -rn | head
#
#   # every 403 one user got
#   jq 'select(.status == 403 and .user_id == 17)' cocco.log
#
#   # everything that happened to submission 812, from the judge's log
#   jq 'select(.submission_id == 812)' judge.log
#
#   -- in DuckDB: requests and p95 latency per route
#   SELECT route, count(*), quantile_cont(duration_ms, 0.95)
#   FROM read_json_auto('cocco.log')
#   WHERE logger = 'cocco.access' GROUP BY route ORDER BY 3 DESC;
#
# WHAT THE LOGS CONTAIN, AND FOR HOW LONG. The access lines carry client IP
# addresses and user ids, and sign-in lines carry email addresses: all of that
# is personal data under the GDPR. It is kept in full - not truncated, since
# the purpose is security and incident investigation, which needs the address
# itself - for SIX MONTHS, and then deleted. Six months is the purpose-bound
# period for security logs: the Italian Garante's minimum for
# system-administrator access logs (2008), and the low end of CNIL's 6-12 month
# recommendation. It is a storage-limitation decision (Art. 5(1)(e)), so it
# also belongs in the university's record of processing (Art. 30) and in the
# privacy notice students see (Art. 13) - confirm both with the DPO.
#
# cocco does not enforce it and cannot: it writes to stdout and does not know
# how old its output is. The collector does:
#
#   - journald: `MaxRetentionSec=6month` in /etc/systemd/journald.conf, or a
#     drop-in under journald.conf.d/. That applies to the WHOLE journal on the
#     host, not only cocco's units - say so to whoever else uses the machine.
#
#   - a file: redirect stdout to it (systemd's `StandardOutput=append:`) and
#     rotate it with logrotate - `daily`, `rotate 183`, `maxage 183`,
#     `compress`, and `copytruncate` or a `postrotate` restart, since the
#     process keeps the file open. Never have several processes rotate one file
#     themselves: under `--workers N` they overwrite each other.
#
#   - nginx's own access log carries the same addresses and needs the same six
#     months. Left on the distribution's default it keeps them for however long
#     that is, which makes the app's retention meaningless.
#
#   - backups of the log directory fall under the same period.
#
# Aggregates computed from the logs that keep no address and no user id -
# requests per route, error rates, timings - are not personal data and may be
# kept for as long as they are useful.

# There is deliberately no [dev] table here. It carries `dummy_auth`, which
# puts a box on the login page that signs you in as whatever address you type -
# no password, no Google, anyone as anyone - and `reset_db`, which drops the
# whole schema on startup and reseeds dummy data. They live together under one
# name a deployment's config file can be read for the *absence* of. See
# `cocco.dev.toml`.
