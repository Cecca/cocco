# Copy this to `cocco.toml` and edit it. Nothing here is required: cocco boots
# with no file at all, and the login page then says Google sign-in is
# unconfigured. For development you want none of this - `cocco.dev.toml` is in
# git and `just dev` reads it.
#
# The path is `cocco.toml` in the working directory, overridable with
# COCCO_CONFIG. `cocco.toml` is gitignored.
#
# THE FILE IS SETTINGS; THE ENVIRONMENT IS SECRETS. The three secrets have no
# file spelling at all - writing them here does nothing but earn a warning:
#
#   COCCO_SECRET_KEY              the session cookie's signing key
#   COCCO_GOOGLE_CLIENT_ID        the OAuth client
#   COCCO_GOOGLE_CLIENT_SECRET
#
# One source each, so there is no precedence to reason about and nothing secret
# in a file that gets copied, diffed and pasted into a bug report. COCCO_CONFIG
# is the exception that proves the rule: it names the file, so it is the one
# setting that cannot be written in one.
#
# The judge reads this same file and takes no --database or --storage of its
# own, so the two processes cannot be pointed at different ones.

[database]
# The SQLAlchemy URL, and it must name a driver with both a sync and an async
# face - `postgresql+psycopg` is the one this project uses: the web app builds
# an async engine from this string and the judge a sync one. (asyncpg has no
# sync side; psycopg2 has no async one.)
#
# Leave the password out and let libpq supply it from PGPASSWORD or ~/.pgpass:
# that keeps the credential out of the file, and an empty URL goes further -
# libpq then resolves the user, database and host from PGUSER, PGDATABASE and
# PGHOST too, which is what `cocco.dev.toml` does.
url = "postgresql+psycopg://cocco@localhost/cocco"

[storage]
# Where test case inputs and expected outputs live - they are referenced by
# path from the database, not stored in it (see DESIGN.md). The web app and the
# judge must resolve a path to the same bytes; they agree by both reading this.
root = "/var/lib/cocco/storage"

[session]
# Set to true behind TLS, so the cookie is never sent in clear.
https_only = true

# How long a session lasts, in seconds. Two weeks.
max_age = 1209600

# The signing key is COCCO_SECRET_KEY and only that. With it unset, cocco
# generates a random one per process and warns: sessions then die on every
# restart and no two workers agree, which is loud - unlike a fixed secret in
# the source tree, and unlike one written in a file somebody may commit.
#   python -c 'import secrets; print(secrets.token_urlsafe(32))'

[auth]
# Who may sign in. A domain admits itself and every subdomain of it, so
# "unipd.it" already covers @studenti.unipd.it and @phd.unipd.it. An empty list
# admits nobody: a misconfiguration should lock the door, not open it.
allowed_domains = ["unipd.it"]

# The site's administrators: the people who may create a course and open the
# admin page at /admin. Unlike `teacher` or `student`, this is not a role on any
# enrollment - a course being created does not exist yet - so it lives in its
# own table, and these addresses are inserted into it on every startup.
#
# A *bootstrap*, not the truth. It is how a brand new deployment gets its first
# administrator, since there is nobody there to appoint one; afterwards the
# table is what is asked, and /admin is where further ones are appointed. So it
# only ever adds: deleting a line from here demotes nobody, and the way to
# remove an administrator is
#   DELETE FROM administrator WHERE email = '...';
# There is deliberately no revoke button - and for the same reason, /admin will
# not block an administrator, since a blocked one could never be let back in.
# Undoing a block by hand, if it ever comes to that, is
#   UPDATE "user" SET blocked_at = NULL, blocked_reason = NULL WHERE email = '...';
#
# An address is listed before its owner has ever signed in - the account is
# created on the first accepted callback from Google - so it must be one
# `allowed_domains` admits, or they will never be able to use it.
# administrators = ["you@unipd.it"]

# The OAuth client, from the Google Cloud console: APIs & Services >
# Credentials > Create credentials > OAuth client ID > Web application. On the
# consent screen ask for the `openid` and `email` scopes only - both are
# non-sensitive, so there is no verification review - and choose "Internal" if
# the institution's Workspace owns the project.
#
# Register the callback under "Authorized redirect URIs", exactly:
#   http://localhost:8000/auth/google/callback     (development)
#   https://cocco.example.org/auth/google/callback (production)
# Google matches the full string, so http://127.0.0.1:8000/... is a *different*
# entry and a trailing slash is a mismatch. Register every origin you browse to.
#
# The two halves themselves are COCCO_GOOGLE_CLIENT_ID and
# COCCO_GOOGLE_CLIENT_SECRET in the environment, and there is no file setting
# for them. Half a credential is a typo, not a decision: cocco says so and
# carries on with Google sign-in disabled rather than refusing to boot.

# A hint for Google's account chooser, not an access check: it pre-selects the
# Workspace domain, while `allowed_domains` is what actually decides. Leave it
# unset if your students' addresses live in a secondary domain.
# google_hd = "unipd.it"

[site]
# The absolute base for the OAuth redirect URI. Leave it unset to derive it from
# the incoming request, which is only correct if the reverse proxy sets
# X-Forwarded-* and uvicorn runs with --proxy-headers. Set it whenever what
# cocco builds and what the console has registered could disagree - a proxy that
# terminates TLS makes the request say `http`, and Google refuses the mismatch.
# base_url = "https://cocco.example.org"

# There is deliberately no [dev] table here. It carries `dummy_auth`, which
# bypasses authentication entirely, `dummy_user`, and `reset_db`, which drops
# every table on startup - so they live together under one name a deployment's
# config file can be read for the *absence* of. See `cocco.dev.toml`.
