[project]
name = "cocco"
version = "0.1.0"
description = "A self-hosted judge for programming challenges"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # A runtime dependency, not a development one: `cocco-web` and `cocco-judge`
    # import `cocco.migrate` to ask whether the database is at the revision they
    # were written against, and refuse to start if it is not.
    "alembic>=1.16",
    "authlib>=1.6",
    "babel>=2.18.0",
    "fastapi[standard]>=0.135.3",
    "greenlet>=3.3.2",
    # The `cocco` CLI talks to the transfer API over HTTP, so httpx is a
    # runtime dependency and not only the thing TestClient is built on.
    "httpx>=0.28.1",
    "icecream>=2.2.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markdown>=3.7",
    "psycopg[binary]>=3.3.4",
    "pygments>=2.20",
    "python-multipart>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "toml>=0.10.2",
    # `cocco/server.py` imports it, so it is declared here rather than left to
    # `fastapi[standard]` to drag in.
    "uvicorn[standard]>=0.34",
]

# The three processes cocco is, and the command that prepares the database two
# of them share. `cocco` talks to the transfer API over HTTP and needs nothing
# else installed; `cocco-web` and `cocco-judge` are the deployment, and
# `cocco-migrate` is what they both refuse to start without.
[project.scripts]
cocco = "cocco.cli:main"
cocco-web = "cocco.server:main"
cocco-judge = "cocco.judge:main"
cocco-migrate = "cocco.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cocco"]
# The tests live inside the package - they are how it is developed, not part of
# what a deployment installs.
exclude = ["cocco/test_*.py", "cocco/conftest.py"]
# `cocco/static/styles.css` is gitignored, and hatchling's file selection is
# gitignore-aware: without this the wheel ships every template and no
# stylesheet, which is the failure mode that looks like a working install.
# It has to exist first - `npm run build:css` before `uv build`.
artifacts = ["cocco/static/styles.css"]

[tool.hatch.build.targets.sdist]
artifacts = ["cocco/static/styles.css"]

[tool.fastapi]
entrypoint = "cocco.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicit, because the whole database fixture design turns on it: an async
# fixture's loop scope otherwise falls through to its *caching* scope, so a
# session-scoped async engine would hand out connections belonging to a loop no
# test is running on. Every async fixture in the suite is function-scoped, so
# this changes nothing today - it stops the default from drifting under us.
asyncio_default_fixture_loop_scope = "function"
# The marker means isolate and a nix with flakes, and nothing else. It used to
# mean Postgres too; the tests all need Postgres now, and say so by skipping.
markers = [
    "integration: tests requiring external services (isolate, nix)",
]
