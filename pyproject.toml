[project]
name = "cocco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.6",
    "babel>=2.18.0",
    "fastapi[standard]>=0.135.3",
    "greenlet>=3.3.2",
    # The `cocco` CLI talks to the transfer API over HTTP, so httpx is a
    # runtime dependency and not only the thing TestClient is built on.
    "httpx>=0.28.1",
    "icecream>=2.2.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markdown>=3.7",
    "psycopg[binary]>=3.3.4",
    "pygments>=2.20",
    "python-multipart>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "toml>=0.10.2",
]

[project.scripts]
cocco = "cocco.cli:main"

[tool.fastapi]
entrypoint = "cocco.main:app"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring external services (isolate, nix, postgres)",
]
