[project]
name = "cocco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "icecream>=2.2.0",
    "jinja2>=3.1.6",
    "sqlalchemy>=2.0",
    "toml>=0.10.2",
]

[tool.fastapi]
entrypoint = "cocco.main:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring isolate and nix to be available",
]
